<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Scene Missing | StreameX</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #e50914;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .error-code {
            font-size: 140px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -5px;
            text-shadow: 0 0 40px rgba(229, 9, 20, 0.4);
            animation: glitch 3s infinite;
        }

        h1 { 
            font-size: 32px; 
            font-weight: 800;
            margin: 0 0 15px 0; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p { 
            font-size: 16px; 
            color: var(--text-muted); 
            max-width: 500px;
            line-height: 1.6;
            margin: 0 0 40px 0;
        }

        .btn-home {
            background-color: var(--accent);
            color: #fff;
            padding: 14px 32px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #b20710;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
        }

        /* Subtle glitch effect for the 404 text */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>
    
    <div class="error-code">404</div>
    
    <h1>Plot Hole Detected</h1>
    
    <p>It looks like this scene was cut from the final edit. The URL you are trying to reach has been moved, deleted, or is currently lost in the multiverse.</p>
    
    <a href="/" class="btn-home"><i class="fas fa-home"></i> Return to Home Base</a>

</body>
</html>
